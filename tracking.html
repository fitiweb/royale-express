<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Shipment - Royale Express Delivery Company</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
  body{background:#f5f5f7;color:#222}
  .header{background:#D40511;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
  .header .logo-area{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .header img{height:38px;background:#fff;padding:4px;border-radius:6px}
  .header a{color:#FFCC00;text-decoration:none;font-weight:600}
  .search-box{background:#fff;padding:28px 20px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .search-box h1{font-size:26px;margin-bottom:8px}
  .search-box p{color:#666;margin-bottom:16px}
  .track-form{display:flex;max-width:520px;margin:0 auto;gap:10px}
  .track-form input{flex:1;padding:14px 16px;border:2px solid #D40511;border-radius:8px;font-size:16px;outline:none}
  .track-form button{padding:14px 22px;background:#D40511;color:#fff;border:none;border-radius:8px;font-weight:800;cursor:pointer}
  .track-form button:hover{background:#a8030e}
  .container{max-width:900px;margin:24px auto;padding:0 16px}
  #trackingDetails{background:#fff;border-radius:12px;padding:22px;box-shadow:0 4px 18px rgba(0,0,0,.06);min-height:120px}
  .status-badge{padding:6px 14px;border-radius:20px;font-weight:800;font-size:12px;letter-spacing:.5px}
  .in-transit{background:#FFF3CD;color:#856404}
  .delivered{background:#D4EDDA;color:#155724}
  .timeline{border-left:3px solid #FFCC00;margin:18px 0 0 10px;padding-left:18px}
  .timeline-item{margin-bottom:18px;position:relative;padding-left:8px}
  .timeline-item::before{content:'';position:absolute;left:-26px;top:4px;width:12px;height:12px;background:#D40511;border-radius:50%;border:2px solid #FFCC00}
  .action-bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
  .action-bar button, .action-bar a{padding:10px 16px;border-radius:8px;border:none;font-weight:700;text-decoration:none;cursor:pointer}
  .btn-print{background:#222;color:#fff}
  .btn-wa{background:#25D366;color:#fff}
  .btn-home{background:#FFCC00;color:#000}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:#f9f9f9;padding:14px;border-radius:8px;margin:14px 0}
  @media(max-width:600px){.info-grid{grid-template-columns:1fr}.track-form{flex-direction:column}}
  #qrcode{display:flex;justify-content:center;margin:16px 0}
</style>
</head>
<body>

<div class="header">
  <div class="logo-area">
    <img src="logo.png" alt="Royale Express"><span>Royale Express</span>
  </div>
  <a href="index.html">← Home</a>
</div>

<div class="search-box">
  <h1>Track Your Shipment</h1>
  <p>Enter your tracking number to see live status & receipt</p>
  <div class="track-form">
    <input id="trackingInput" placeholder="e.g. RE-20261016-926278" />
    <button onclick="handleTrack()">TRACK NOW</button>
  </div>
  <p style="margin-top:10px;font-size:12px;color:#999">Example: RE-20261016-926278</p>
</div>

<div class="container">
  <div class="action-bar" id="actionBar" style="display:none">
    <button class="btn-print" onclick="window.print()">🖨️ Print Receipt</button>
    <a class="btn-wa" id="waShare" target="_blank">💬 Share via WhatsApp</a>
    <a class="btn-home" href="index.html">Home</a>
  </div>

  <div id="trackingDetails" style="text-align:center;color:#777;padding:40px">
    <h3>🔍 Enter tracking number above to track</h3>
    <p>Your receipt with logo, QR code, and comments will appear here like DHL.</p>
  </div>

  <div style="text-align:center;margin-top:18px">
    <div id="qrcode"></div>
    <p style="font-size:11px;color:#aaa">Scan to share tracking link</p>
  </div>
</div>

<script type="module">
  import { displayResult } from './app.js';

  const params = new URLSearchParams(window.location.search);
  const codeFromUrl = params.get('code');

  window.handleTrack = function(){
    const code = document.getElementById('trackingInput').value.trim();
    if(!code){ alert('Please enter tracking number'); return; }
    // Update URL without reload
    history.replaceState(null, '', `?code=${code}`);
    document.getElementById('actionBar').style.display = 'flex';
    displayResult(code);
  }

  // Auto track if ?code= is in URL
  if(codeFromUrl){
    document.getElementById('trackingInput').value = codeFromUrl;
    document.getElementById('actionBar').style.display = 'flex';
    displayResult(codeFromUrl);
  }

  // Enter key support
  document.getElementById('trackingInput').addEventListener('keypress', e=>{
    if(e.key==='Enter') handleTrack();
  });
</script>

</body>
</html>
